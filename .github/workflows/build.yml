name: Test and build

# Every push to main: run the logic tests, export the web build and the
# Android APK, and publish both to GitHub Pages via the gh-pages branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import project (so art files can be loaded)
        run: timeout 300 godot --headless --editor --quit || true
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" test.log; then
            echo "::error::GDScript errors found"; exit 1
          fi

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Set up export templates and Android settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Import project
        run: timeout 300 godot --headless --editor --quit || true
      - name: Export web build
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
          # Give the game data a new name every build, so phones never keep running an old cached copy.
          PCK="game-$(echo "$GITHUB_SHA" | cut -c1-8).pck"
          mv build/web/index.pck "build/web/$PCK"
          sed -i "s/\"index.pck\"/\"$PCK\"/g" build/web/index.html
          if ! grep -q '"mainPack"' build/web/index.html; then
            sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"$PCK\"/" build/web/index.html
          fi
          grep -q "\"mainPack\":\"$PCK\"" build/web/index.html
      - name: Export Android APK (debug-signed)
        continue-on-error: true
        run: |
          mkdir -v -p build/android
          godot --headless --export-debug "Android" build/android/project-ascent.apk
          cp build/android/project-ascent.apk build/web/project-ascent.apk
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }}"
